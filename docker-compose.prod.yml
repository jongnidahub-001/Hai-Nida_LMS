services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "5000"
    # ค่า secret (GOOGLE_API_KEY, SECRET_KEY, ADMIN_*, CORS_ORIGINS) อ่านจาก .env.prod บน server
    env_file:
      - .env.prod
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      - chromadb
    volumes:
      - ./backend/temp:/app/temp
      - ./backend/chroma_db:/app/chroma_db
    networks:
      - app-network
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:1.0.15
    expose:
      - "8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - CHROMA_DB_IMPL=chromadb.db.impl.sqlite.SqliteDB
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  chroma-data: